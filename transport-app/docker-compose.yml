# ====================================================
# JRR Transport System — Docker Compose
# Run: docker-compose up -d
# ====================================================

version: "3.9"

services:
  web-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jrr-transport-hub
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
